# Proxy reverso nginx para a interface web (opcional).
#
# 1. sudo apt install nginx apache2-utils
# 2. sudo htpasswd -c /etc/nginx/imazongeo-upload.htpasswd <usuario>
# 3. Copie para /etc/nginx/sites-available/imazongeo-upload, troque
#    server_name e ative:
#      sudo ln -s /etc/nginx/sites-available/imazongeo-upload /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# 4. Inclua o domínio em WEB_ALLOWED_HOSTS no arquivo .env do serviço e
#    reinicie: sudo systemctl restart imazongeo-upload
# 5. HTTPS: sudo apt install certbot python3-certbot-nginx &&
#    sudo certbot --nginx -d upload.exemplo.org

server {
    listen 80;
    server_name upload.exemplo.org;

    # Mesmo limite de envio da aplicação (1 GB) e tempo para processar
    client_max_body_size 1G;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # A aplicação não tem login próprio: não exponha sem autenticação
    auth_basic "ImazonGeo Upload";
    auth_basic_user_file /etc/nginx/imazongeo-upload.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Alternativa: servir como caminho num site que já existe ---------------
